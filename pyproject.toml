[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-attention"
version = "0.1.0"
description = "Local WhatsApp export importer and attention digest"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wa-attention = "wa_attention.cli:main"

[tool.setuptools.packages.find]
include = ["wa_attention*"]
